# Conda environment for the sacsma package (incl. the torch-based sacsma.dpl subpackage).
#   conda env create -f environment.yml
#   conda activate sacsma
#
# Python 3.14 + numba 0.65 + conda-forge pytorch 2.10/cuda130 is the combo verified
# working on this machine (RTX PRO 1000, driver CUDA 13.1).
name: sacsma
channels:
  - conda-forge
dependencies:
  - python=3.14
  # The conda-forge CUDA pytorch builds are MKL-linked (cuda130_mkl), so the old
  # libblas=*=*openblas pin can't hold. The crash it guarded against was the mkl 2026.x
  # PREVIEW ABI mismatch with numpy (2-D matmul / np.linalg delay-load error 0xC06D007F
  # on Windows) - pin mkl below 2026 instead. (The model itself uses no BLAS; this
  # matters only for metrics + matplotlib.)
  - mkl<2026
  - pytorch=2.10.*=cuda130*   # sacsma.dpl differentiable model (GPU training)
  - numpy>=1.24
  - numba>=0.65
  - pandas>=2.2       # "ME"/"MS" offset aliases (the old "M" is gone in 3.x)
  - matplotlib>=3.7   # cal/val diagnostics + cross-compare figures
  # gridded forcing store (NetCDF)
  - xarray>=2024.1
  - netcdf4
  # GIS (CalSim catchment layers; Voronoi catchment overlap)
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - scipy>=1.10       # Voronoi spacing + gamma-tail QMAP
  - pypdf>=4.0        # data/targets/dwr_unimpaired/dwr_unimpaired.py: DWR Appendix B table transcription
  - openpyxl>=3.1     # data/reference/bcm/bcm_routing_params.py: the BCM routing workbook
  - requests>=2.31    # build-script downloads: cdec_fnf, download_gis, aorc_region, bcm_region
  - zstandard>=0.22   # data/inputs/forcing/aorc_region.py: the AORC zarr chunks
  - pillow>=10        # sacsma dpl calsim atlas: figures embedded in the HTML
  # dev
  - ruff>=0.4
  - pip
  - pip:
      - -e .
# No rasterio and no earthengine-api here, on purpose: this environment's GDAL belongs to
# geopandas/pyogrio, and the model has no use for the Google client stack. The scripts
# that read rasters (sample_gis.py, reitz_et.py, build_flowlens.py) or pull from Earth
# Engine (gee_*.py) run in the separate environment of environment-gis.yml;
# `sacsma dpl calsim tier2` reaches its flow-length tracer there through --trace-python.
